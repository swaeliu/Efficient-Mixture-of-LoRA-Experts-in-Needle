# Phase 4A — 30-seed robustness study of sparse routing on the Phase 3 task.
# Protocol frozen before the confirmatory run. Data generation / frozen W0 are the
# Phase 2/3 make_problem() unchanged; within a seed every method shares data, W0
# and minibatch order; dense / sparse top-2 / sparse top-1 share identical initial
# expert and router parameters (paired initialisation).
experiment:
  name: phase4a_robustness
  output_dir: outputs
  seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009,
          1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019,
          1020, 1021, 1022, 1023, 1024, 1025, 1026, 1027, 1028, 1029]

dtype: float32

data:                      # identical to configs/sparse_molora.yaml
  input_dim: 128
  output_dim: 128
  n_regimes: 4
  indicator_dims: 4
  regime_rank: 8
  delta_rel_norm: 0.5
  noise_std: 0.0
  n_train: 8192
  n_val: 1024
  n_test: 1024
  bias: false

model:
  n_experts: 4
  rank: 8
  alpha: 16.0
  router_temperature: 1.0
  router_init: xavier
  b_init_std: 0.0
  execution_mode: dispatch

baselines:
  single_lora_rank: 8
  matched_lora_rank: 34

# Randomness sources, derived from the study seed s with molora.protocol.derive_seed:
#   data + backbone : make_problem(cfg, s)        (Phase 3 convention, unchanged)
#   expert + router init : derive_seed(s, "init")  (same for every MoE method -> paired)
#   minibatch order : derive_seed(s, "shuffle")   (same for every method)
# Needle's optimizers are deterministic given parameters and gradients.

methods:
  single_lora:     {kind: lora, rank: 8}
  matched_lora:    {kind: lora, rank: 34}
  dense_molora:    {kind: dense}
  sparse_top2:     {kind: sparse, top_k: 2, router_grad_mode: renormalized}
  sparse_top1_ste: {kind: sparse, top_k: 1, router_grad_mode: straight_through}

training:                  # Phase 3 frozen protocol
  optimizer: adam
  batch_size: 32
  max_steps: 2000
  eval_every: 100
  track_every: 100
  learning_rate:
    single_lora: 0.001
    matched_lora: 0.001
    dense_molora: 0.003
    sparse_top2: 0.003
    sparse_top1_ste: 0.003

# Pre-registered failure criterion (recorded before any 1000-1029 run):
# a run has FAILED if its held-out VALIDATION MSE after 2000 steps exceeds 0.01.
# Rationale: 0.01 is ~2% of the frozen-backbone error (0.48) and ~20x the level
# every converged MoE run reached in Phase 3 (4e-4 to 6e-4); it separates
# "learned the routing" from "stuck" without being tuned to new outcomes.
# Test labels are never used for classification.
failure:
  val_mse_threshold: 0.01

# Balance-loss ablation (Switch-style E * sum f_i P_i, molora.sparse_molora.load_balance_loss).
# Coefficient chosen by a validation-only pilot on seeds 2000-2004 (disjoint from
# the study seeds), then evaluated on the 30 study seeds with the SAME protocol.
balance_ablation:
  pilot_seeds: [2000, 2001, 2002, 2003, 2004]
  pilot_coefficients: [0.01, 0.1, 1.0]
  coefficient: 0.01          # from the validation-only pilot (outputs/phase4a_robustness_pilot_balance/20261108-170829):
                             # 0 failures for every coefficient; median val MSE 4.26e-4 (0.01) < 5.99e-4 (0.1) < 5.26e-3 (1.0)
  methods:
    sparse_top2_balance:     {kind: sparse, top_k: 2, router_grad_mode: renormalized, balance: true}
    sparse_top1_ste_balance: {kind: sparse, top_k: 1, router_grad_mode: straight_through, balance: true}

analysis:
  n_bootstrap: 10000
  bootstrap_seed: 0
  alpha: 0.05
